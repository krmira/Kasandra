name: Build Kasandra

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bin: kasandra.exe
          - name: linux-x64
            os: ubuntu-latest
            bin: kasandra
          - name: macos-arm64
            os: macos-latest
            bin: kasandra

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --locked || cargo build --release

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/${{ matrix.bin }} dist/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../kasandra-${{ matrix.name }}.zip ${{ matrix.bin }}
          else
            tar czf ../kasandra-${{ matrix.name }}.tar.gz ${{ matrix.bin }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kasandra-${{ matrix.name }}
          path: |
            kasandra-${{ matrix.name }}.zip
            kasandra-${{ matrix.name }}.tar.gz
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
