name: Build Kasandra

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# cancel older runs of the same branch/PR so they don't eat build time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0          # incremental data is useless in CI and bloats the cache
  CARGO_NET_RETRY: 10
  CARGO_PROFILE_RELEASE_DEBUG: 0

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bin: kasandra.exe
            out: kasandra-windows-x64.exe
          - name: linux-x64
            os: ubuntu-latest
            bin: kasandra
            out: kasandra-linux-x64
          - name: macos-arm64
            os: macos-latest
            bin: kasandra
            out: kasandra-macos-arm64

    steps:
      - uses: actions/checkout@v4

      # cached apt packages (skips the slow apt-get install on repeat runs)
      - name: Install Linux deps
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev libssl-dev pkg-config libgtk-3-dev
          version: 1.0

      - uses: dtolnay/rust-toolchain@stable

      # caches ~/.cargo registry + target/ dependencies; only main writes the cache,
      # PRs and tags read from it
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: kasandra-${{ matrix.name }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build (release)
        run: cargo build --release

      # give each binary a unique name: with archive:false the file name becomes the artifact name
      - name: Rename binary
        shell: bash
        run: cp "target/release/${{ matrix.bin }}" "${{ matrix.out }}"

      # v7+ with archive:false uploads the single file as-is (no zip)
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.out }}
          archive: false
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
