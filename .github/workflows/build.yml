name: Build Kasandra

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_PROFILE_RELEASE_DEBUG: 0

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bin: kasandra.exe
            out: kasandra-windows-x64.exe
          - name: linux-x64
            os: ubuntu-latest
            bin: kasandra
            out: kasandra-linux-x64
          - name: macos-arm64
            os: macos-latest
            bin: kasandra
            out: kasandra-macos-arm64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev libssl-dev pkg-config libgtk-3-dev
          version: 1.0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: kasandra-${{ matrix.name }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build (release)
        run: cargo build --release

      # ---------- Windows / Linux: bare binary ----------
      - name: Rename binary
        if: runner.os != 'macOS'
        shell: bash
        run: cp "target/release/${{ matrix.bin }}" "${{ matrix.out }}"

      # ---------- macOS: .app bundle with icon (a bundle is a folder, so it ships as one zip) ----------
      - name: Make macOS .app
        if: runner.os == 'macOS'
        run: |
          APP=Kasandra.app
          mkdir -p $APP/Contents/MacOS $APP/Contents/Resources
          cp target/release/kasandra $APP/Contents/MacOS/kasandra

          # kasandra.png -> kasandra.icns
          mkdir kasandra.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s kasandra.png --out kasandra.iconset/icon_${s}x${s}.png
            sips -z $((s*2)) $((s*2)) kasandra.png --out kasandra.iconset/icon_${s}x${s}@2x.png
          done
          iconutil -c icns kasandra.iconset -o $APP/Contents/Resources/kasandra.icns

          cat > $APP/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Kasandra</string>
            <key>CFBundleDisplayName</key><string>Kasandra</string>
            <key>CFBundleIdentifier</key><string>com.kasandra.app</string>
            <key>CFBundleExecutable</key><string>kasandra</string>
            <key>CFBundleIconFile</key><string>kasandra</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>1.0</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST

          codesign --force --deep -s - $APP
          ditto -c -k --keepParent $APP "${{ matrix.out }}"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.out }}
          archive: false
          if-no-files-found: error

      # ---------- Linux: launcher files, uploaded as plain files next to the binary ----------
      - name: Linux desktop entry
        if: runner.os == 'Linux'
        run: |
          cat > kasandra.desktop <<'DESK'
          [Desktop Entry]
          Name=Kasandra
          Exec=kasandra
          Icon=kasandra
          Type=Application
          Categories=Utility;
          StartupWMClass=kasandra
          DESK

      - name: Upload kasandra.desktop
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          path: kasandra.desktop
          archive: false

      - name: Upload kasandra.png
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          path: kasandra.png
          archive: false

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
